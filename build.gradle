def thermalEnvironmentFile = file("${thermalPhase0bReportDir}/environment.json")

tasks.register('thermalBenchmarkEnvironmentManifest') {
    group = 'verification'
    description = 'Writes the frozen local environment for Phase 0b benchmark evidence.'
    outputs.file thermalEnvironmentFile
    doLast {
        thermalPhase0bReportDir.mkdirs()
        def operatingSystem = java.lang.management.ManagementFactory.operatingSystemMXBean
        def physicalMemoryBytes = operatingSystem instanceof com.sun.management.OperatingSystemMXBean
                ? operatingSystem.totalMemorySize
                : -1L
        def revisionOutput = new ByteArrayOutputStream()
        def revisionResult = exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = revisionOutput
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def dirtyOutput = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = dirtyOutput
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def launcher = thermalBenchmarkJava.get()
        def manifest = [
                schemaVersion: 1,
                evidenceScope: 'legacy-microbaseline-not-phase0b-acceptance',
                generatedAt: java.time.OffsetDateTime.now().toString(),
                source: [
                        revision: revisionResult.exitValue == 0
                                ? revisionOutput.toString('UTF-8').trim()
                                : 'unknown',
                        dirtyWorktree: !dirtyOutput.toString('UTF-8').isBlank()
                ],
                hardware: [
                        processorIdentifier: System.getenv('PROCESSOR_IDENTIFIER') ?: 'unknown',
                        logicalProcessors: Runtime.runtime.availableProcessors(),
                        physicalMemoryBytes: physicalMemoryBytes,
                        architecture: System.getProperty('os.arch')
                ],
                operatingSystem: [
                        name: System.getProperty('os.name'),
                        version: System.getProperty('os.version')
                ],
                benchmarkJvm: [
                        executable: launcher.executablePath.asFile.absolutePath,
                        vendor: launcher.metadata.vendor.toString(),
                        version: launcher.metadata.javaRuntimeVersion.toString(),
                        vmVersion: launcher.metadata.jvmVersion,
                        heap: '-Xms2G -Xmx2G',
                        collector: 'G1'
                ],
                game: [
                        minecraft: minecraft_version,
                        forge: forge_version,
                        modSet: 'JMH main runtime classpath; not the production modpack',
                        viewDistanceChunks: 'not-applicable-to-microbenchmark',
                        simulationDistanceChunks: 'not-applicable-to-microbenchmark',
                        randomTickSpeed: 'not-applicable-to-microbenchmark'
                ],
                harness: [
                        jmh: '1.37',
                        jmhPlugin: '0.7.3',
                        warmupIterations: 3,
                        measurementIterations: 5,
                        iterationSeconds: 1,
                        legacyQueryForks: 1,
                        legacyPlayerSamplingForks: 2,
                        profiler: 'gc'
                ],
                limitations: [
                        'Legacy microbenchmark plus one Forge GameTest capture diagnostic; no production-like multiplayer server workload.',
                        'Player snapshotCopy is synthetic section-copy cost; worker samples start from prepared input and do not measure ServerLevel or chunk access.',
                        'The Forge capture report measures full construction over one loaded room and separately observes absent-footprint chunk loads.',
                        'Reference and geometry benchmarks calibrate the harness and are not V1 candidate evidence.',
                        'JFR task is diagnostic and deliberately runs without a JMH fork; primary timings come from legacy-jmh.json.'
                ]
        ]
        thermalEnvironmentFile.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(manifest)) + System.lineSeparator()
    }
}

