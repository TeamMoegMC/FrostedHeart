def thermalPhaseAReportDir = file("${buildDir}/reports/thermal-phase-a")
def thermalPhaseAJmhFile = file("${thermalPhaseAReportDir}/geometry-jmh.json")
def thermalPhaseAJmhHumanFile = file("${thermalPhaseAReportDir}/geometry-jmh.txt")
def thermalPhaseARetainedFile = file("${thermalPhaseAReportDir}/retained-size.json")
def thermalPhaseACensusFile = file("${thermalPhaseAReportDir}/resolver-census.json")
def thermalPhaseAJfrFile = file("${thermalPhaseAReportDir}/geometry-diagnostic.jfr")
def thermalPhaseAJfrResultFile = file("${thermalPhaseAReportDir}/geometry-jfr-jmh.json")
def thermalPhaseAJfrHumanFile = file("${thermalPhaseAReportDir}/geometry-jfr-jmh.txt")
def thermalPhaseAEnvironmentFile = file("${thermalPhaseAReportDir}/environment.json")

def validateThermalPhaseAJmhReport = {
    def results = new groovy.json.JsonSlurper().parse(thermalPhaseAJmhFile)
    def benchmarkMethods = results.collect { it.benchmark.tokenize('.').last() }.toSet()
    def requiredMethods = ['resolveDispatched', 'compileBrick'] as Set
    def missingMethods = requiredMethods - benchmarkMethods
    if (!missingMethods.isEmpty()) {
        throw new GradleException("Phase A JMH result is incomplete; missing ${missingMethods}")
    }
    def invalidScores = results.findAll { result ->
        def score = result.primaryMetric?.score
        !(score instanceof Number) || !Double.isFinite(score.doubleValue())
    }
    if (!invalidScores.isEmpty()) {
        throw new GradleException('Phase A JMH result contains non-finite primary scores')
    }
    def sampleResults = results.findAll { it.mode == 'sample' }
    def missingPercentiles = sampleResults.findAll { result ->
        def percentiles = result.primaryMetric?.scorePercentiles
        ['95.0', '99.0'].any { percentile ->
            def value = percentiles?.get(percentile)
            !(value instanceof Number) || !Double.isFinite(value.doubleValue())
        }
    }
    if (sampleResults.isEmpty() || !missingPercentiles.isEmpty()) {
        throw new GradleException('Phase A JMH result is missing finite p95/p99 samples')
    }
}

tasks.register('thermalPhaseAEnvironmentManifest') {
    group = 'verification'
    description = 'Writes the local environment and scope for Phase A evidence.'
    outputs.file thermalPhaseAEnvironmentFile
    doLast {
        thermalPhaseAReportDir.mkdirs()
        def operatingSystem = java.lang.management.ManagementFactory.operatingSystemMXBean
        def physicalMemoryBytes = operatingSystem instanceof com.sun.management.OperatingSystemMXBean
                ? operatingSystem.totalMemorySize
                : -1L
        def revisionOutput = new ByteArrayOutputStream()
        def revisionResult = exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = revisionOutput
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def launcher = thermalBenchmarkJava.get()
        def manifest = [
                schemaVersion: 1,
                evidenceScope: 'phase-a-local-correctness-prototype',
                generatedAt: java.time.OffsetDateTime.now().toString(),
                sourceRevision: revisionResult.exitValue == 0
                        ? revisionOutput.toString('UTF-8').trim()
                        : 'unknown',
                hardware: [
                        processorIdentifier: System.getenv('PROCESSOR_IDENTIFIER') ?: 'unknown',
                        logicalProcessors: Runtime.runtime.availableProcessors(),
                        physicalMemoryBytes: physicalMemoryBytes,
                        architecture: System.getProperty('os.arch')
                ],
                operatingSystem: [
                        name: System.getProperty('os.name'),
                        version: System.getProperty('os.version')
                ],
                benchmarkJvm: [
                        vendor: launcher.metadata.vendor.toString(),
                        version: launcher.metadata.javaRuntimeVersion.toString(),
                        vmVersion: launcher.metadata.jvmVersion,
                        heap: '-Xms2G -Xmx2G',
                        collector: 'G1'
                ],
                game: [minecraft: minecraft_version, forge: forge_version],
                harness: [
                        jmh: '1.37',
                        warmupIterations: 2,
                        measurementIterations: 4,
                        iterationMillis: 500,
                        forks: 1,
                        modes: ['avgt', 'sample'],
                        profiler: 'gc'
                ],
                limitations: [
                        'Resolver snapshots are prebuilt; chunk capture is measured separately by Forge fixtures.',
                        'JOL measures the object-heavy correctness layout, not final packed production arenas.',
                        'This is local prototype evidence, not a production multiplayer server profile.'
                ]
        ]
