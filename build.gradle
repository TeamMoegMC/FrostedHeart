def thermalPhase0bReportDir = file("${buildDir}/reports/thermal-phase0b")
def thermalPlayerSamplingForgeCaptureFile =
        file("${thermalPhase0bReportDir}/legacy-player-sampling-forge-capture.json")
def thermalBenchmarkJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(17)
}

tasks.register('thermalLegacyPlayerSamplingForgeCapture') {
    group = 'verification'
    description = 'Runs Forge GameTests and verifies the real-world legacy player capture report.'
    dependsOn tasks.named('runGameTestServer')
    inputs.file thermalPlayerSamplingForgeCaptureFile
    doLast {
        if (!thermalPlayerSamplingForgeCaptureFile.isFile()) {
            throw new GradleException(
                    "Forge player capture report is missing: ${thermalPlayerSamplingForgeCaptureFile}")
        }
        def report = new groovy.json.JsonSlurper().parse(thermalPlayerSamplingForgeCaptureFile)
        def loadedCapture = report.loadedFootprintCapture
        def loadProbe = report.unloadedFootprintProbe
        if (loadedCapture?.loadedBefore != 4 || loadedCapture?.loadedAfter != 4) {
            throw new GradleException('Forge player capture did not measure a loaded four-chunk footprint')
        }
        if (!(loadProbe?.constructorTriggeredLoads instanceof Number)
                || loadProbe.constructorTriggeredLoads.intValue() <= 0) {
            throw new GradleException(
                    'Forge player capture did not record legacy active chunk loading')
        }
        ['threadSafeFalse', 'threadSafeTrue'].each { mode ->
            ['p50Ns', 'p95Ns', 'p99Ns', 'maxNs'].each { percentile ->
                def value = loadedCapture[mode]?.getAt(percentile)
                if (!(value instanceof Number) || value.longValue() <= 0L) {
                    throw new GradleException(
                            "Forge player capture has invalid ${mode}.${percentile}: ${value}")
                }
            }
        }
    }
    outputs.upToDateWhen { false }
}

