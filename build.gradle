//    id "dev.architectury.loom" version "1.2-SNAPSHOT"
	id "com.diffplug.eclipse.apt" version "4.2.0"
	id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
    id 'org.spongepowered.mixin' version "${mixingradle_version}"
    id 'org.parchmentmc.librarian.forgegradle' version "${librarian_version}"
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'org.cadixdev.licenser' version '0.6.1'
    id 'maven-publish'
    id 'eclipse'
    
    id 'idea'
}
//apply from: 'https://raw.githubusercontent.com/SizableShrimp/Forge-Class-Remapper/main/classremapper.gradle'
//apply from: 'https://raw.githubusercontent.com/SizableShrimp/ForgeUpdatesRemapper/main/remapper.gradle'

group = 'com.teammoeg'
version = "${minecraft_version}-${mod_version}"
archivesBaseName = 'frostedheart'
compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
	client{java{srcDirs=[]} resources{srcDirs=[]}}
	server{java{srcDirs=[]} resources{srcDirs=[]}}
    main {
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
            ]
            exclude 'assets/frostedheart/lang/**/'
            exclude 'assets/frostedheart/font/unifont/*'
        }
    }
    noDatagen{java{srcDirs=[]} resources{srcDirs=[]}}
	datagen {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
        resources {
            srcDirs = [
                    "$rootDir/src/datagen/resources",
            ]
            exclude 'assets/frostedheart/lang/**/'
        }
    }
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            // debug level logging
            // property 'forge.logging.markers', 'REGISTRIES'
             property 'forge.logging.console.level', 'debug'

            // for normal run just log at info level
//            property 'forge.logging.console.level', 'info'

            //jvmArgs '-Xdebug','-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=9009'

            // For Mac OS X users with an Apple Silicon chip,
            // you would need the latest GLFW version that supports Apple Silicon.
            // You can download the latest GLFW version from https://www.glfw.org/download.html
            // and set the LIBGLFW_PATH_MACOS environment variable to the path of the
            // GLFW library file libglfw.3.dylib
            // NOTE for IDEA user: You need to manually set the JVM arg
            // and the environment variable in the IDEA run configuration.
            if (System.env.LIBGLFW_PATH_MACOS != null) {
                println "LIBGLFW_PATH_MACOS is set to ${System.env.LIBGLFW_PATH_MACOS}"
                jvmArgs "-Dorg.lwjgl.glfw.libname=${System.env.LIBGLFW_PATH_MACOS}"
            }

            // Similar steps for Linux users
            if (System.env.LIBGLFW_PATH != null) {
                jvmArgs "-Dorg.lwjgl.glfw.libname=${System.env.LIBGLFW_PATH}/lib/libglfw.so"
            }
            environment "FML_EARLY_WINDOW_DARK","1"
			jvmArgs "-DFile.Encoding=UTF-8"
            arg "-mixin.config=" + "frostedheart.mixins.json"
            arg "-mixin.config=" + "frostedresearch.mixins.json"
            arg "-mixin.config=" + "chorda.mixins.json"
            arg "-uuid 87fb189d-1840-4b18-9b3f-84a4f427294e"
            mods {
                frostedheart {
                	source sourceSets.noDatagen
                    source sourceSets.main
                    source sourceSets.client
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=" + "frostedheart.mixins.json"
            arg "-mixin.config=" + "chorda.mixins.json"
            arg "-mixin.config=" + "frostedresearch.mixins.json"
            mods {
                frostedheart {
                	source sourceSets.noDatagen
                    source sourceSets.main
                    source sourceSets.server
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', 'frostedresearch'
            property 'forge.logging.console.level', 'info'
            arg "-mixin.config=frostedheart.mixins.json"
            arg "-mixin.config=frostedresearch.mixins.json"
            arg "-mixin.config=chorda.mixins.json"
            mods {
                frostedheart {
                    source sourceSets.noDatagen
                    source sourceSets.main
                    source sourceSets.server
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args "-mixin.config=" + "frostedheart.mixins.json",'--mod', 'frostedheart','--all','--output', file('src/generated/resources/'), 'validate', '--existing', file('src/main/resources/')
            arg "-mixin.config=" + "frostedresearch.mixins.json"
            arg "-mixin.config=" + "chorda.mixins.json"
            mods {
                frostedheart {
					source sourceSets.main
                    source sourceSets.datagen
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.register('validateResearchCatalog', JavaExec) {
    group = 'verification'
    description = 'Runs registry-independent production-invariant preflight for an external fhresearches catalogue.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.teammoeg.frostedresearch.ResearchCatalogPreflight'
    args((findProperty('researchCatalogDir') ?: file('run/config/fhresearches').absolutePath).toString())
}

tasks.register('prepareResearchGameTestStructures', Copy) {
    from file('src/gametest/resources')
    into file('run-gametest/gameteststructures')
}

tasks.register('prepareResearchGameTestCatalog', Sync) {
    from file('src/gametest/catalog')
    into file('run-gametest/config/fhresearches')
}

tasks.register('cleanResearchGameTestWorld', Delete) {
    delete file('run-gametest/world')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('cleanResearchGameTestWorld')
    dependsOn tasks.named('prepareResearchGameTestStructures')
    dependsOn tasks.named('prepareResearchGameTestCatalog')
}

mixin {
    add sourceSets.main, "chorda.refmap.json"
}

