tasks.register('thermalPhaseLQueryJmh', JavaExec) {
    group = 'verification'
    description = 'Measures synthetic Phase L published-air query batches for 1/10/50/100 receivers.'
    dependsOn tasks.named('jmhCompileGeneratedClasses')
    javaLauncher = thermalBenchmarkJava
    classpath = thermalJmhRuntimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args 'com.teammoeg.frostedheart.content.climate.thermal.benchmark.ThermalPublishedAirQueryBenchmark.queryPublishedAirBatch',
            '-wi', '3', '-i', '5', '-w', '1s', '-r', '1s', '-f', '2',
            '-prof', 'gc', '-foe', 'true',
            '-jvmArgs', '-Xms2G -Xmx2G -XX:+UseG1GC',
            '-rf', 'json', '-rff', thermalPhaseLQueryJmhFile.absolutePath,
            '-o', thermalPhaseLQueryJmhHumanFile.absolutePath
    doFirst {
        thermalPhaseLReportDir.mkdirs()
        [thermalPhaseLQueryJmhFile, thermalPhaseLQueryJmhHumanFile].each { output ->
            if (output.exists() && !output.delete()) {
                throw new GradleException("Could not replace generated benchmark artifact: ${output}")
            }
        }
    }
    doLast {
        def results = new groovy.json.JsonSlurper().parse(thermalPhaseLQueryJmhFile)
        def keys = results.collect { result ->
            "${result.params?.layout}:${result.params?.receiverCount}"
        }.toSet()
        def requiredKeys = ['shared_page', 'distributed_pages'].collectMany { layout ->
            ['1', '10', '50', '100'].collect { receiverCount ->
                "${layout}:${receiverCount}"
            }
        }.toSet()
        def missingKeys = requiredKeys - keys
        if (!missingKeys.isEmpty()) {
            throw new GradleException(
                    "Phase L query JMH result is incomplete; missing ${missingKeys}")
        }
        def invalid = results.findAll { result ->
            def score = result.primaryMetric?.score
            def allocation = result.secondaryMetrics?.get('gc.alloc.rate.norm')?.score
            !(score instanceof Number) || !Double.isFinite(score.doubleValue())
                    || !(allocation instanceof Number)
                    || !Double.isFinite(allocation.doubleValue())
        }
        if (!invalid.isEmpty()) {
            throw new GradleException(
                    'Phase L query JMH result contains invalid latency or allocation scores')
        }
    }
    outputs.upToDateWhen { false }
}

