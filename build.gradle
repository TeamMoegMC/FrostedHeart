def thermalPlayerSamplingJmhFile =
        file("${thermalPhase0bReportDir}/legacy-player-sampling-jmh.json")
def thermalPlayerSamplingJmhHumanFile =
        file("${thermalPhase0bReportDir}/legacy-player-sampling-jmh.txt")

tasks.register('thermalLegacyPlayerSamplingJmh', JavaExec) {
    group = 'verification'
    description = 'Measures prepared legacy player snapshots and worker simulation sample times.'
    dependsOn tasks.named('jmhCompileGeneratedClasses')
    javaLauncher = thermalBenchmarkJava
    classpath = thermalJmhRuntimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args 'com.teammoeg.frostedheart.content.climate.thermal.benchmark.LegacyPlayerSamplingBenchmark.*',
            '-wi', '3', '-i', '5', '-w', '1s', '-r', '1s', '-f', '2',
            '-prof', 'gc', '-foe', 'true',
            '-jvmArgs', '-Xms2G -Xmx2G -XX:+UseG1GC',
            '-rf', 'json', '-rff', thermalPlayerSamplingJmhFile.absolutePath,
            '-o', thermalPlayerSamplingJmhHumanFile.absolutePath
    doFirst {
        thermalPhase0bReportDir.mkdirs()
        [thermalPlayerSamplingJmhFile, thermalPlayerSamplingJmhHumanFile].each { output ->
            if (output.exists() && !output.delete()) {
                throw new GradleException("Could not replace generated benchmark artifact: ${output}")
            }
        }
    }
    doLast {
        def results = new groovy.json.JsonSlurper().parse(thermalPlayerSamplingJmhFile)
        def keys = results.collect { result ->
            def method = result.benchmark.tokenize('.').last()
            def fixture = result.params?.fixture ?: '-'
            def cacheMode = result.params?.cacheMode ?: '-'
            "${method}:${fixture}:${cacheMode}"
        }.toSet()
        def requiredKeys = [
                'snapshotCopy:all_air:-', 'snapshotCopy:room:-',
                'simulateWorker:all_air:hot', 'simulateWorker:all_air:cold',
                'simulateWorker:room:hot', 'simulateWorker:room:cold'
        ] as Set
        def missingKeys = requiredKeys - keys
        if (!missingKeys.isEmpty()) {
            throw new GradleException(
                    "Legacy player sampling JMH result is incomplete; missing ${missingKeys}")
        }
        def invalidScores = results.findAll { result ->
            def score = result.primaryMetric?.score
            !(score instanceof Number) || !Double.isFinite(score.doubleValue())
        }
        if (!invalidScores.isEmpty()) {
            throw new GradleException(
                    'Legacy player sampling JMH result contains non-finite primary scores')
        }
    }
    outputs.upToDateWhen { false }
}

