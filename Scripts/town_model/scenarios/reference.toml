[meta]
name = "TWR 城镇临界自循环参考场景"
description = "8/24/48 人、T2 能量塔与球形加热器热场的首轮可调基线；参数不是最终平衡结论。"

[sources]
world_temperature = "src/main/java/com/teammoeg/frostedheart/content/climate/WorldTemperature.java"
heat_area = "src/main/java/com/teammoeg/frostedheart/content/climate/gamedata/chunkheat/ChunkHeatData.java"
generator = "src/main/java/com/teammoeg/frostedheart/content/climate/block/generator/GeneratorData.java"
radiator = "src/main/java/com/teammoeg/frostedheart/content/climate/block/radiator/RadiatorState.java"
housing = "src/main/java/com/teammoeg/frostedheart/content/town/buildings/house/HouseDailyModel.java"
hunting = "src/main/java/com/teammoeg/frostedheart/content/town/buildings/hunting/HuntingBaseBuilding.java"

[simulation]
days = 120                    # game day
dt_hours = 0.25               # game hour
runs = 1000                   # Monte Carlo runs per combination
seed = 20260810
populations = [8, 24, 48]     # residents
soft_comfort_degree_hours = 110.0 # substantial event threshold, C*hour per day

[climate]
baseline_c = -10.0            # degrees C; WorldTemperature overworld baseline
local_offset_c = 0.0          # degrees C; biome + altitude scenario offset
daily_swing_c = 2.0           # degrees C
tracks = 3                    # independent climate-event tracks
calm_days_min = 2.0           # game day
calm_days_max = 7.0
event_days_min = 2.0
event_days_max = 7.0
warm_probability = 0.20
cold_amplitude_min_c = 8.0
cold_amplitude_max_c = 55.0
cold_amplitude_shape = 4.0       # high-tier waves are deliberately rare
warm_amplitude_min_c = 4.0
warm_amplitude_max_c = 18.0
design_cold_start_day = 30.0
design_cold_duration_days = 5.0
design_cold_amplitude_c = 55.0
forecast_hours = 120          # game hour; current HUD horizon

[heat_field]
# Designer-facing first estimates. These fictional-game coefficients must be
# calibrated; unlike derived FV/(block3*C*day), they distinguish steady loss
# from startup energy.
envelope_loss_fv_per_block2_c_hour = 0.008
volume_leak_fv_per_block3_c_hour = 0.0002
capacitance_fv_per_block3_c = 0.006

[network]
capacity_fv_per_hour = 4000.0
efficiency = 0.90
current_efficiency = 1.0
current_heat_efficiency = 1.2
current_capacity_heat_per_tick = 25.0

[population]
worker_fraction = 0.68
swe_per_worker = 1.0
fce_per_person = 1.0
food_energy_per_fce_day = 7.0
nutrition_per_fce_day = 1.0
cold_food_per_fce_degree_hour = 0.003
health_loss_no_food_per_day = 8.0
mental_loss_no_food_per_day = 5.0
health_loss_per_survival_degree_hour = 0.020
mental_loss_per_comfort_degree_hour = 0.002
health_recovery_per_day = 2.0
mental_recovery_per_day = 1.5
death_threshold = 5.0

[inventory.initial]
biomass = 80.0
industry_goods = 0.0

[inventory.initial_per_person]
fuel_fv = 130000.0
food_energy = 49.0
nutrition = 7.0

[inventory.capacity]
biomass = 2000.0
industry_goods = 100000.0

[inventory.capacity_per_person]
fuel_fv = 150000.0
food_energy = 210.0
nutrition = 30.0

[layout]
